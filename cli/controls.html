<!-- The step-through page around the frame (ADR-0007), inlined into explainer.html after the player. Loaded with ?bare,
     as capture loads it, the page is the frame alone. The chrome is neutral: its own tokens, the same for every pack. -->
<style>
  :root { --chrome-bg: #ececec; --chrome-surface: #ffffff; --chrome-ink: #1d2127; --chrome-dim: #555c66; --chrome-line: #7f8690; --chrome-focus: #0072b2; }
  html.chrome, html.chrome body { height: 100%; }
  html.chrome body { background: var(--chrome-bg); color: var(--chrome-ink); font: 15px/1.5 system-ui, sans-serif; }
  main { box-sizing: border-box; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 20rem; gap: 16px; padding: 16px; }
  /* The player is the largest 16:9 frame, plus the controls row, that fits its cell. */
  #stage { container-type: size; display: grid; place-items: center; min-width: 0; min-height: 0; }
  #stage:fullscreen { background: var(--chrome-bg); }
  .box { position: relative; }
  .half { position: absolute; top: 0; bottom: 0; width: 50%; padding: 0; border: 0; background: none; }
  .half:first-of-type { left: 0; cursor: w-resize; }
  .half:last-of-type { right: 0; cursor: e-resize; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--chrome-focus); outline-offset: -2px; }
  .player { width: min(100cqw, calc((100cqh - 40px) * 16 / 9)); }
  /* The step bar: a hairline, filled to the playhead, notched at each step boundary; a native range scrubs it. */
  .controls { display: flex; align-items: center; gap: 12px; height: 40px; }
  .bar { position: relative; flex: 1; height: 16px; }
  .bar::before, .fill { content: ''; position: absolute; left: 0; top: 7.5px; height: 1px; }
  .bar::before { right: 0; background: var(--chrome-line); }
  .fill { width: calc(var(--p, 0) * 100%); background: var(--chrome-ink); }
  [data-notch] { position: absolute; top: 4px; width: 1px; height: 8px; margin-left: -0.5px; background: var(--chrome-line); }
  .bar input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; appearance: none; background: none; cursor: pointer; }
  .bar input::-webkit-slider-thumb { appearance: none; width: 3px; height: 16px; border-radius: 1px; background: var(--chrome-ink); }
  .fs { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 4px; background: none; color: var(--chrome-ink); cursor: pointer; }
  .fs:hover { background: var(--chrome-surface); }
  .fs svg { width: 20px; height: 20px; }
  .bar input::-moz-range-thumb { width: 3px; height: 16px; border: 0; border-radius: 1px; background: var(--chrome-ink); }
  /* Only the transcript scrolls. */
  #transcript { align-self: center; max-height: 100%; overflow: auto; margin: 0; padding: 0 0 0 2em; color: var(--chrome-dim); }
  #transcript button { display: block; width: 100%; padding: 6px 8px; border: 0; border-radius: 4px; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  #transcript [aria-current] { background: var(--chrome-surface); color: var(--chrome-ink); box-shadow: inset 3px 0 var(--chrome-ink); }
  @media (max-width: 800px) {
    main { grid-template-columns: minmax(0, 1fr); grid-template-rows: min(calc((100vw - 32px) * 9 / 16 + 40px), 70%) minmax(0, 1fr); }
    #transcript { align-self: start; }
  }
</style>
<script>
if (!new URLSearchParams(location.search).has('bare')) {
  document.documentElement.classList.add('chrome');
  const el = (tag, attrs = {}, ...children) => {
    const e = document.createElement(tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    e.append(...children);
    return e;
  };
  const frame = document.getElementById('frame');
  frame.setAttribute('role', 'img');
  frame.setAttribute('aria-label', DATA.title);
  // Each half of the frame is a button that steps; the keys are their keyboard path too.
  const halves = [['Previous step', 'ArrowLeft', '←'], ['Next step', 'ArrowRight', '→']].map(([name, key, glyph]) =>
    el('button', { type: 'button', class: 'half', 'aria-label': name, title: `${name} (${glyph})`, 'aria-keyshortcuts': key }));
  const box = el('div', { class: 'box' });
  const START = DATA.steps.map(([start]) => start);
  const REST = DATA.steps.map(([, end]) => end - 1 / 30);
  const LAST = REST.at(-1);
  // Where each step's actions have all played: from there to its rest the step holds.
  const HOLD = DATA.steps.map(([start], i) => DATA.events.reduce((at, e) => (e.step === i ? Math.max(at, e.t0 + e.d) : at), start));
  const range = el('input', { type: 'range', min: 0, max: LAST, step: 'any', value: 0, 'aria-label': 'Position', 'aria-keyshortcuts': 'Home End' });
  const fill = el('div', { class: 'fill' });
  const notches = START.slice(1).map(start => el('div', { 'data-notch': '', style: `left: ${(start / LAST) * 100}%` }));
  const bar = el('div', { class: 'bar' }, fill, ...notches, range);
  // The only visible button (ADR-0007): fullscreen takes the frame and its bar, and leaves the transcript behind.
  const fs = el('button', { type: 'button', class: 'fs', 'aria-label': 'Fullscreen', 'aria-pressed': 'false', title: 'Fullscreen (f)', 'aria-keyshortcuts': 'f' });
  fs.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>';
  const player = el('div', { class: 'player' }, box, el('div', { class: 'controls' }, bar, fs));
  const stage = el('div', { id: 'stage' }, player);
  const lines = DATA.narration.map(line => el('button', { type: 'button' }, line));
  const transcript = el('ol', { id: 'transcript', 'aria-label': 'Transcript' }, ...lines.map(b => el('li', {}, b)));
  frame.replaceWith(el('main', {}, stage, transcript));
  box.append(frame, ...halves);

  // Stepping: every control goes through seek(t). A step's rest is its last frame; Next plays the next step to its
  // rest, or finishes the step on screen (from its hold, that is the next step); Back jumps to the previous rest, with no
  // reverse animation.
  const EPS = 1e-6;
  let t = 0, run = null;
  let current;
  const show = to => {
    t = Math.min(Math.max(to, 0), LAST);
    seek(t);
    range.value = t;
    bar.style.setProperty('--p', t / LAST);
    // The transcript marks the step on screen, and keeps it in view as the explainer plays.
    const now = lines[stepAt(t)];
    if (now === current) return;
    current?.removeAttribute('aria-current');
    now.setAttribute('aria-current', 'step');
    range.setAttribute('aria-valuetext', `Step ${stepAt(t) + 1} of ${lines.length}`);
    if (current) now.scrollIntoView({ block: 'nearest' }); // not at load, where it would move where Tab starts
    current = now;
  };
  const go = to => { run = null; show(to); };
  const play = (from, to) => {
    const r = run = { at: performance.now() };
    show(from);
    const tick = now => {
      if (run !== r) return;
      const at = Math.max(from, from + (now - r.at) / 1000);
      if (at >= to) go(to);
      else { show(at); requestAnimationFrame(tick); }
    };
    requestAnimationFrame(tick);
  };
  const next = () => {
    const i = stepAt(t);
    if (!run && t >= Math.min(HOLD[i], REST[i]) - EPS) { if (i + 1 < REST.length) play(START[i + 1], REST[i + 1]); else go(REST[i]); }
    else if (!run && t <= START[i] + EPS) play(START[i], REST[i]);
    else go(REST[i]);
  };
  const back = () => {
    const i = stepAt(t);
    go(i > 0 ? REST[i - 1] : 0);
  };
  const fullscreen = () => (document.fullscreenElement ? document.exitFullscreen() : stage.requestFullscreen()).catch(() => {});
  fs.addEventListener('click', fullscreen);
  document.addEventListener('fullscreenchange', () => fs.setAttribute('aria-pressed', String(!!document.fullscreenElement)));
  const toggle = () => (run ? go(t) : play(t >= LAST - EPS ? 0 : t, LAST));
  halves[0].addEventListener('click', back);
  halves[1].addEventListener('click', next);
  range.addEventListener('input', () => go(Number(range.value)));
  lines.forEach((line, i) => line.addEventListener('click', () => go(REST[i])));
  show(0);
  const keys = { ArrowRight: next, ArrowLeft: back, ' ': toggle, Home: () => go(0), End: () => go(LAST), f: fullscreen, F: fullscreen };
  document.addEventListener('keydown', e => {
    const act = keys[e.key];
    if (!act || e.ctrlKey || e.metaKey || e.altKey) return;
    e.preventDefault();
    if (!e.repeat || e.key.startsWith('Arrow')) act();
  });
}
</script>
