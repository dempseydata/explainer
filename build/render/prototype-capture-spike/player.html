<!doctype html>
<!-- PROTOTYPE — M0 capture spike. Throwaway; the answer lives in the ADR, not here. -->
<meta charset="utf-8">
<title>capture spike player</title>
<style>html,body{margin:0;background:#fff}svg{display:block}</style>
<script src="node_modules/roughjs/bundled/rough.js"></script>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.96  0 0 0 0 0.95  0 0 0 0 0.91  0 0 0 -0.35 1"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#445"/>
    </marker>
  </defs>
  <rect id="bg" width="1920" height="1080"/>
  <g id="edges"></g><g id="nodes"></g>
</svg>
<script>
const PACK = new URLSearchParams(location.search).get('pack') || 'standard';
const FPS = 30, BOIL_FPS = 8, W = 260, H = 110;
const DUR = [5,6,6,7,6,7,6,6,6,6,7,7];              // 12 steps, 75 s
const STEP_T = DUR.map((_, i) => DUR.slice(0, i).reduce((a, b) => a + b, 0));
const TOTAL = DUR.reduce((a, b) => a + b, 0);
const REVEAL = PACK === 'pencil' ? 0.8 : 0.6;       // draw-on is slower than a fade
const COLORS = ['#4e79a7', '#f28e2b', '#59a14f', '#b07aa1'];

// 20 nodes on a 5×4 grid, 22 edges (row chains + a few verticals).
const nodes = Array.from({length: 20}, (_, i) => ({
  id: 'n' + i, x: 150 + (i % 5) * 360, y: 150 + Math.floor(i / 5) * 230,
  label: 'Ticket ' + (i + 1), type: i % 4, ev: {},
}));
const edges = [];
for (let i = 0; i < 20; i++) if (i % 5 < 4) edges.push({a: i, b: i + 1, ev: {}});
for (const i of [0, 2, 4, 7, 11, 13]) edges.push({a: i, b: i + 5, ev: {}});

// Timeline: node i revealed in step floor(i/2); edges once both ends are up.
nodes.forEach((n, i) => n.ev.reveal = {t0: STEP_T[Math.floor(i / 2)] + (i % 2) * 0.4, d: REVEAL});
edges.forEach(e => e.ev.reveal = {t0: Math.max(nodes[e.a].ev.reveal.t0, nodes[e.b].ev.reveal.t0) + 0.5, d: REVEAL});
for (const i of [0, 5, 10, 15]) nodes[i].ev.highlight = {t0: STEP_T[10], d: 0.5};
for (const i of [15, 16, 17, 18, 19]) nodes[i].ev.fog = {t0: STEP_T[11], d: 0.5};
for (const i of [3, 8]) nodes[i].ev.fog = {t0: STEP_T[4], d: 0.5};

const prog = (ev, t) => ev ? Math.min(1, Math.max(0, (t - ev.t0) / ev.d)) : 0;
const all = [...nodes, ...edges];

// Everything visible in a frame is a function of these numbers (+ boil tick for pencil),
// so equal keys mean equal pixels and the capturer can skip the screenshot.
window.frameKey = t => {
  const k = all.map(o => ['reveal', 'fog', 'highlight'].map(p => prog(o.ev[p], t).toFixed(4)).join(',')).join(';');
  return PACK === 'pencil' ? k + '|' + Math.floor(t * BOIL_FPS) : k;
};
window.TOTAL = TOTAL; window.FPS = FPS;

const svg = document.getElementById('s'), NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent && parent.appendChild(e);
  return e;
};
const edgePts = e => {
  const A = nodes[e.a], B = nodes[e.b];
  return e.b === e.a + 1 ? [A.x + W, A.y + H / 2, B.x, B.y + H / 2] : [A.x + W / 2, A.y + H, B.x + W / 2, B.y];
};

// ---------- standard pack: fade + scale, static between steps ----------
function buildStandard() {
  document.getElementById('bg').setAttribute('fill', '#fafafa');
  for (const e of edges) {
    const [x1, y1, x2, y2] = edgePts(e);
    const d = x1 === x2 ? `M${x1} ${y1}V${y2}` : `M${x1} ${y1}H${(x1 + x2) / 2}V${y2}H${x2}`;
    e.g = el('path', {d, fill: 'none', stroke: '#445', 'stroke-width': 3, 'marker-end': 'url(#arrow)'}, document.getElementById('edges'));
  }
  for (const n of nodes) {
    n.g = el('g', {}, document.getElementById('nodes'));
    n.glow = el('rect', {x: n.x - 6, y: n.y - 6, width: W + 12, height: H + 12, rx: 18, fill: '#ffd166', filter: 'url(#glow)'}, n.g);
    el('rect', {x: n.x, y: n.y, width: W, height: H, rx: 14, fill: COLORS[n.type], stroke: '#223', 'stroke-width': 2}, n.g);
    el('text', {x: n.x + W / 2, y: n.y + H / 2 + 10, 'text-anchor': 'middle', 'font-size': 30, 'font-family': 'Helvetica, Arial, sans-serif', fill: '#fff'}, n.g).textContent = n.label;
  }
}
function seekStandard(t) {
  for (const n of nodes) {
    const r = prog(n.ev.reveal, t), f = prog(n.ev.fog, t), h = prog(n.ev.highlight, t);
    const s = 0.85 + 0.15 * r, cx = n.x + W / 2, cy = n.y + H / 2;
    n.g.setAttribute('opacity', r * (1 - 0.7 * f));
    n.g.setAttribute('transform', `translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`);
    n.glow.setAttribute('opacity', h);
  }
  for (const e of edges) e.g.setAttribute('opacity', prog(e.ev.reveal, t));
}

// ---------- pencil pack: rough.js draw-on + seeded 8 fps line boil ----------
const rc = window.rough && rough.svg(svg);
let boilTick = -1;
function buildPencil() {
  const bg = document.getElementById('bg');
  bg.setAttribute('fill', '#f6f3ea'); bg.setAttribute('filter', 'url(#paper)');
  for (const o of all) o.g = el('g', {}, document.getElementById(o.a === undefined ? 'nodes' : 'edges'));
}
function redrawPencil(tick) {
  const seed = i => 1 + i * 97 + tick * 7919;        // rough.js needs a non-zero seed
  nodes.forEach((n, i) => {
    n.g.replaceChildren();
    n.shape = rc.rectangle(n.x, n.y, W, H, {seed: seed(i), roughness: 1.4, stroke: '#333', strokeWidth: 2.2,
      fill: COLORS[n.type], fillStyle: ['hachure', 'cross-hatch', 'zigzag', 'dashed'][n.type], hachureGap: 9});
    n.hl = rc.ellipse(n.x + W / 2, n.y + H / 2, W + 70, H + 60, {seed: seed(i) + 3, stroke: '#c0392b', strokeWidth: 3, roughness: 2});
    n.smudge = rc.rectangle(n.x - 8, n.y - 8, W + 16, H + 16, {seed: seed(i) + 5, stroke: 'none', fill: '#777', fillStyle: 'cross-hatch', hachureGap: 5, fillWeight: 3});
    n.text = el('text', {x: n.x + W / 2, y: n.y + H / 2 + 10, 'text-anchor': 'middle', 'font-size': 32,
      'font-family': 'Bradley Hand, Comic Sans MS, cursive', fill: '#222', stroke: '#fff', 'stroke-width': 5, 'paint-order': 'stroke'});
    n.text.textContent = n.label;
    n.g.append(n.shape, n.text, n.hl, n.smudge);
    for (const k of ['shape', 'hl', 'smudge']) n[k + 'Len'] = [...n[k].querySelectorAll('path')].map(p => [p, p.getTotalLength()]);
  });
  edges.forEach((e, i) => {
    e.g.replaceChildren();
    const [x1, y1, x2, y2] = edgePts(e);
    const g = rc.linearPath([[x1, y1], [x2, y2]], {seed: seed(100 + i), stroke: '#333', strokeWidth: 2, roughness: 1.2});
    const back = x1 === x2 ? [[x2 - 10, y2 - 16], [x2, y2], [x2 + 10, y2 - 16]] : [[x2 - 16, y2 - 10], [x2, y2], [x2 - 16, y2 + 10]];
    const head = rc.linearPath(back, {seed: seed(200 + i), stroke: '#333', strokeWidth: 2});
    e.g.append(g, head);
    e.len = [...e.g.querySelectorAll('path')].map(p => [p, p.getTotalLength()]);
  });
}
const drawOn = (list, p) => { for (const [path, len] of list) { path.style.strokeDasharray = len; path.style.strokeDashoffset = len * (1 - p); } };
function seekPencil(t) {
  const tick = Math.floor(t * BOIL_FPS);
  if (tick !== boilTick) { redrawPencil(tick); boilTick = tick; }
  for (const n of nodes) {
    const r = prog(n.ev.reveal, t);
    n.g.setAttribute('visibility', r > 0 ? 'visible' : 'hidden');
    drawOn(n.shapeLen, r);
    n.text.setAttribute('opacity', Math.max(0, r * 2 - 1));      // lettering lands in the second half
    drawOn(n.hlLen, prog(n.ev.highlight, t));
    n.smudge.setAttribute('opacity', 0.55 * prog(n.ev.fog, t));
  }
  for (const e of edges) {
    const r = prog(e.ev.reveal, t);
    e.g.setAttribute('visibility', r > 0 ? 'visible' : 'hidden');
    drawOn(e.len, r);
  }
}

(PACK === 'pencil' ? buildPencil : buildStandard)();
window.seek = PACK === 'pencil' ? seekPencil : seekStandard;
seek(0);
</script>
